name: Update prices

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # allow a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices from official stores (6 countries)
        run: python3 scripts/update_prices.py

      - name: Commit updated prices, history, product pages and sitemap
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.js history.json sitemap.xml p/
          git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push
